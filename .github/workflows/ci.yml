name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jayvis-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: file:./prisma/ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm test
      - run: bash scripts/release-build-check.sh

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      DATABASE_URL: file:./prisma/build.db
      DBML_PARSER_URL: http://127.0.0.1:3031
      DBML_PARSER_TIMEOUT_MS: "5000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build
      - name: Pack the built app
        run: |
          tar -czf "$RUNNER_TEMP/jayvis-release.tar.gz" \
            --exclude node_modules \
            --exclude .git \
            --exclude .env \
            --exclude '.env.*' \
            --exclude 'prisma/*.db' \
            --exclude 'prisma/*.db-journal' \
            .
      - name: Publish the release the VM pulls
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "deploy-${GITHUB_SHA}" \
            "$RUNNER_TEMP/jayvis-release.tar.gz" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Deploy ${GITHUB_SHA}" \
            --notes "Built app for the VM." \
            --latest
